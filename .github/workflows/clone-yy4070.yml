name: Clone yy4070

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  clone:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy yy4070 main branch
        run: |
          rm -rf /tmp/yy4070
          git clone --depth 1 https://github.com/fuliwz/yy4070.git /tmp/yy4070
          rsync -a --delete --exclude='.git' /tmp/yy4070/ ./

      - name: Commit cloned project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Clone yy4070 main into yy91"
          git push origin HEAD:main
